<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    />
    <title>Moyo header</title>

    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
    />

    <link
      rel="stylesheet"
      href="./style.css"
    />
  </head>
  <body>
    <header>
      <div class="container">
        <a
          href="#logo_link"
          class="logo-link"
        >
          <img
            src="images/logo.png"
            alt="logo"
            class="logo"
          />
        </a>

        <nav class="nav">
          <ul>
            <li>
              <a
                href="#apple"
                class="apple is-active"
              >
                apple
              </a>
            </li>
            <li>
              <a
                href="#samsung"
                class="samsung"
              >
                samsung
              </a>
            </li>
            <li>
              <a
                href="#smartphones"
                class="smartphones"
              >
                smartphones
              </a>
            </li>
            <li>
              <a
                href="#laptopsComputers"
                class="laptopsComputers"
                data-qa="hover"
              >
                laptops & Computers
              </a>
            </li>
            <li>
              <a
                href="#gadgets"
                class="gadgets"
              >
                gadgets
              </a>
            </li>
            <li>
              <a
                href="#tablets"
                class="tablets"
              >
                tablets
              </a>
            </li>
            <li>
              <a
                href="#photo"
                class="photo"
              >
                photo
              </a>
            </li>
            <li>
              <a
                href="#video"
                class="video"
              >
                video
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>
  </body>
</html>
